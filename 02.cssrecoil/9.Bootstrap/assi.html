<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>payment</title>
</head>
<body>
    <div class="container">
        <h1 class="text-center">Pricing</h1>
        <p class="text-center">Please checkout our most effective payment model</p>
        <div class="row text-center justify-content-evenly">
            <div class="col">
                <div class="card  h-100 shadow-sm">  
                <div class="card-header">
                    Free
                </div>       
                <div class="card-body">
                    <h1 class="card-title">$0/mo</h1>
                    <p>10 user include</p>
                    <p>2 GB of Storage</p>
                    <p>Email support</p>
                    <button class="btn btn-outline-primary">Sign in for free</button>
                </div>       
            </div>
            </div>
            <div class="col">
                <div class="card h-100 shadow-sm">  
                <div class="card-header">
                    Pro
                </div>       
                <div class="card-body">
                    <h1>$15/mo</h1>
                    <p>20 user include</p>
                    <p>10 GB of Storage</p>
                    <p>Priority Email support</p>
                    <button class="btn btn-primary">Get Started</button>
                </div>       
            </div>
            </div>
            <div class="col-md-12 col-lg-4">
                <div class="card h-100 shadow-sm">  
                <div class="card-header">
                    Enterprise
                </div>       
                <div class="card-body">
                    <h1>$29/mo</h1>
                    <p>30 user include</p>
                    <p>15 GB of Storage</p>
                    <p>Phone & Email support</p>
                    <button class="btn btn-primary">Contect us</button>
                </div>       
            </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
