<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Registration Form</h1>
    <form action="/action">
      <input
        type="text"
        placeholder="First name"
        name="fname"
      /><!--  always give name attribute to all input http://127.0.0.1:5500/action?fname=aryan&lname=sahu&gender=Male&tos_agree=on -->
      <input type="text" placeholder="Last name" name="lname" />
      <label for="gender">
        Please select your gender
        <select name="gender" id="gender">
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </label>
      <p>
        do you agree with all terms and services ?
        <input type="checkbox" name="tos_agree" id="tos_agree" />
        <label for="tos_agree">Yes, I Agree</label>
      </p>
      <button>Register</button>
    </form>
  </body>
</html>
