<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <h1>Lets Play Simon Game!</h1>
    <h2>Press any key to start the Game</h2>
    <div class="box-container">
      <div class="box-outer">
        <div class="box-inner red" type="button" id="red">1</div>
        <div class="box-inner green" type="button" id="green">2</div>
      </div>
      <div class="box-outer">
        <div class="box-inner orange" type="button" id="orange">3</div>
        <div class="box-inner blue" type="button" id="blue">4</div>
      </div>
    </div>
    <h3>highest scores</h3>
    <div class="score"></div>

    <script src="app.js"></script>
  </body>
</html>
