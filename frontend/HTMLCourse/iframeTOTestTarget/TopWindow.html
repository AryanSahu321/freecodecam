<body style="background-color: lightblue; padding: 20px; font-family: sans-serif;">
    <h2>1. Top Window (Main Page)</h2>
    
    <iframe src="outer-frame.html" width="500rem" height="500rem" name="top"></iframe>
</body>

<!-- target="_self"Opens the link inside the iframe itself. (This is the default behavior if you don't add a target).
target="_blank"Opens the link in a completely new browser tab or window.
target="_parent"Breaks out of the iframe and opens the link in the immediate parent page containing the iframe.
target="_top"Breaks out of all frames and opens the link in the full body of the window (removes all nested iframes). -->
